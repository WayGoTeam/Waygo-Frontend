# Shared WayGo server body: security headers + all locations.
# Included from both the plain-HTTP server (nginx.conf) and the HTTPS server
# (tls.conf) so the two can never drift apart.

server_tokens off;

# Security Headers
add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";
add_header Referrer-Policy "strict-origin-when-cross-origin";
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy (L12): per-directive allow-lists instead of a blanket
# "https: http: ws: 'unsafe-eval'" default. The production Vite bundle has no
# inline <script>, so script-src does not need 'unsafe-inline'/'unsafe-eval'.
# 'unsafe-inline' is kept ONLY for style-src because Leaflet, Recharts and the
# Google Identity button set inline style attributes.
#   script-src  : own bundle + Google Identity Services (GSI) loader
#   connect-src : same-origin REST/SSE, same-host WebSocket, Google token endpoint
#   img-src     : basemap tiles (OSM / CARTO / Esri), Google avatars, data/blob
#   font-src    : Google Fonts (index.html preconnect), data:
#   frame-src   : Google One-Tap / OAuth iframe
#   worker-src  : blob: (Leaflet.VectorGrid decodes MVT in a worker in some builds)
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://*.googleusercontent.com https://accounts.google.com; connect-src 'self' ws://$host wss://$host https://accounts.google.com https://oauth2.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self';" always;

# Stricter candidate policy (no 'unsafe-inline' on styles) in Report-Only mode.
# Watch the browser console / a report endpoint for violations before promoting it.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://*.googleusercontent.com https://accounts.google.com; connect-src 'self' ws://$host wss://$host https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; worker-src 'self' blob:;" always;

# Block access to hidden files (.env, .git, etc.)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Block path traversal attempts
location ~* (\.\./) {
    return 403;
}

# Throttled requests get a JSON body + Retry-After instead of the nginx HTML page.
location @rate_limited {
    default_type application/json;
    add_header Retry-After 2 always;
    add_header Cache-Control "no-store" always;
    return 429 '{"error":"rate_limited","message":"Too many requests, please retry shortly."}';
}

location / {
    # Static assets are served from disk; a fresh page load pulls ~20 files and each
    # route change lazy-loads more chunks, so the burst must comfortably exceed that.
    limit_req zone=general burst=200 nodelay;
    limit_req_status 429;
    error_page 429 = @rate_limited;
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
}

# Proxy API requests to the backend service
location /api/ {
    # A page load issues ~15 API calls at once, then ~10/min of background polling per tab.
    limit_req zone=api burst=100 nodelay;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    proxy_pass http://backend-service:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable buffering for SSE (Server-Sent Events) to work properly
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
}

# Higher rate limit for weather endpoint (fetches per district)
location /api/v1/weather {
    limit_req zone=weather burst=60 nodelay;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    proxy_pass http://backend-service:8080/api/v1/weather;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
}

# Same-origin vector tiles (L01). The browser must never be pointed at
# "localhost:3001" (that is the *user's* machine); instead /tiles/... is
# proxied here to the Martin MVT server on the internal docker network.
# e.g. /tiles/mock_traffic/12/2615/1544  ->  http://waygo-martin:3000/mock_traffic/12/2615/1544
location /tiles/ {
    # A map pan/zoom requests dozens of tiles at once.
    limit_req zone=general burst=200 nodelay;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    proxy_pass http://waygo-martin:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Tiles change slowly; let browsers cache them briefly.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60";
    # add_header inside a location disables inheritance of server-level headers,
    # so the security headers must be repeated here.
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_intercept_errors on;
    error_page 502 503 504 = @tiles_unavailable;
}

# Explicit, cacheable-for-a-short-time failure so the map can show an error
# state instead of the browser logging opaque "Failed to fetch".
location @tiles_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 503 '{"error":"traffic tiles unavailable"}';
}

# Proxy STOMP WebSocket connections
location /ws {
    proxy_pass http://backend-service:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

error_page   500 502 503 504  /50x.html;
location = /50x.html {
    root   /usr/share/nginx/html;
}
