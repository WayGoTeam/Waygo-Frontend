# HTTPS server for the public domain.
#
# Installed as /etc/nginx/conf.d/waygo-tls.conf by
# /docker-entrypoint.d/20-waygo-tls.sh ONLY when a certificate for
# __WAYGO_DOMAIN__ exists under /etc/letsencrypt/live/. Without that guard a
# host with no certificates (any local `docker compose up`) would fail to
# start nginx entirely.

# Port 80 for the public domain: ACME renewals + redirect everything else.
# The default_server in default.conf still serves localhost/IP over plain HTTP.
server {
    listen 80;
    server_name __WAYGO_DOMAIN__;

    server_tokens off;

    # Lets `certbot renew --webroot -w /var/www/certbot` work without stopping nginx.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __WAYGO_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__WAYGO_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__WAYGO_DOMAIN__/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:WayGoSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/waygo-app.conf;
}
