limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=weather:10m rate=120r/m;

server {
    listen 80;
    server_name localhost waygo.duckdns.org;
    
    server_tokens off;
    
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost waygo.duckdns.org;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/waygo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waygo.duckdns.org/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: http: data: ws: wss: blob:;";

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block path traversal attempts
    location ~* (\.\./) {
        return 403;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass http://backend-service:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for SSE (Server-Sent Events) to work properly
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    # Higher rate limit for weather endpoint (fetches per district)
    location /api/v1/weather {
        limit_req zone=weather burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend-service:8080/api/v1/weather;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    # Proxy STOMP WebSocket connections
    location /ws {
        proxy_pass http://backend-service:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
