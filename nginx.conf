# Rate limiting.
#
# NOTE on the key: behind Docker Desktop (and some cloud LBs) every external client
# reaches nginx with the SAME $remote_addr (Docker's gateway), so these zones are
# effectively *global*, not per-user. The previous values (api 30r/m, burst 10) were
# exhausted by a single page load (~15 API calls) plus background polling, producing
# spontaneous 429s for everyone. Limits below are sized for abuse protection only;
# the backend GlobalRateLimitFilter still enforces 50r/s / 500r/m per forwarded IP.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=weather:10m rate=10r/s;

# Plain-HTTP server. This is the default server for port 80, so it answers
# localhost, the bare IP and any host that is not the public domain.
#
# In production the HTTPS server and the http->https redirect for the public
# domain live in waygo-tls.conf, which /docker-entrypoint.d/20-waygo-tls.sh
# installs only when a real certificate is present. Local `docker compose up`
# has no certificate, so the stack stays reachable over plain HTTP.
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/waygo-app.conf;
}
